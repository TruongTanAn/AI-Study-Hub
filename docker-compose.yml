services:
  # ==============================
  # PHP + Apache Service
  # ==============================
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-study-hub-php
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./logs:/var/www/html/logs
      - ./cache:/var/www/html/cache
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ai_study_hub}
      DB_USER: ${DB_USER:-ai_user}
      DB_PASSWORD: ${DB_PASSWORD:-ai_password}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ai-study-network

  # ==============================
  # MySQL Service
  # ==============================
  mysql:
    image: mysql:8.0
    container_name: ai-study-hub-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ai_study_hub}
      MYSQL_USER: ${DB_USER:-ai_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ai_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-study-network

  # ==============================
  # phpMyAdmin Service
  # ==============================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai-study-hub-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: ${DB_HOST:-mysql}
      PMA_PORT: ${DB_PORT:-3306}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 300M
    depends_on:
      - mysql
    networks:
      - ai-study-network

# ==============================
# Volumes
# ==============================
volumes:
  mysql_data:
    driver: local

# ==============================
# Networks
# ==============================
networks:
  ai-study-network:
    driver: bridge
